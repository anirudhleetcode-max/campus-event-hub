name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  DATABASE_URL: postgresql://campus:campus@localhost:5432/campus_hub?schema=public
  DIRECT_DATABASE_URL: postgresql://campus:campus@localhost:5432/campus_hub?schema=public
  TEST_DATABASE_URL: postgresql://campus:campus@localhost:5432/campus_hub_test?schema=public
  AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-else-123456
  CRON_SECRET: ci-only-cron-secret
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus
          POSTGRES_DB: campus_hub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U campus" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit & integration tests
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus
          POSTGRES_DB: campus_hub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U campus" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # The Playwright webServer command creates, migrates and seeds campus_hub_e2e itself.
      - run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgresql://campus:campus@localhost:5432/campus_hub_e2e?schema=public
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
