# Render Blueprint — hackathon demo deployment of Campus Event Hub.
#
# Render dashboard → New → Blueprint → select this repository. It creates:
#   • campus-event-hub     Docker web service (the repo's Dockerfile), public https URL
#   • campus-event-hub-db  managed PostgreSQL 16 (persistent)
# and generates AUTH_SECRET / CRON_SECRET itself (never stored in git).
#
# On start the container applies migrations and, because
# SEED_DEMO_DATA_IF_EMPTY=true, loads the demo accounts/events into an EMPTY
# database only (a restart or redeploy never re-seeds or wipes data).
#
# APP_ENV=staging: a demo/prototype environment. Razorpay LIVE keys are refused
# (TEST keys only), and uploads use the container's local disk, which is NOT
# persistent on Render (lost on restart/redeploy) unless S3 variables are added.
# The demo itself doesn't need uploads. See README → "Hackathon deployment".
databases:
  - name: campus-event-hub-db
    plan: free
    region: singapore
    databaseName: campus_hub
    user: campus
    postgresMajorVersion: "16"

services:
  - type: web
    name: campus-event-hub
    runtime: docker
    plan: free
    region: singapore
    branch: claude/adoring-goodall-dtt00c
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: campus-event-hub-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: campus-event-hub-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: SEED_DEMO_DATA_IF_EMPTY
        value: "true"
      # The free instance has 512 MB of RAM; cap the JS heap so Node collects
      # garbage before the container hits the memory limit.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=320"
      # NEXT_PUBLIC_APP_URL is optional here: Render provides the service URL as
      # RENDER_EXTERNAL_URL and the app uses it. Set it only for a custom domain.
      # Optional integrations (Razorpay, Resend, S3): add their variables later in
      # the service's Environment tab — never in this file.
